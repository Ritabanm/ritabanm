<svg width="760" height="510" viewBox="0 0 760 510" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="760" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a11"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Radar Area Gradient -->
    <linearGradient id="radarFill" x1="245" y1="115" x2="515" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.50"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }
    .glow-dot {
      animation: pulse 2.4s infinite ease-in-out;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="756" height="506" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Decorative Header Bar -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="4" fill="#10b981" class="glow-dot"/>
    <text x="18" y="10" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#10b981" letter-spacing="1">LIVE TELEMETRY // COMMIT-WEIGHTED RADAR</text>
    <text x="0" y="34" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">
      Systems &amp; Engineering Contribution Focus
    </text>
    <text x="0" y="52" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8">
      Dynamically aggregated across multi-GPU scaling, low-level kernels, robotics, and security codebases
    </text>
  </g>

  <!-- Timestamp Badge -->
  <g transform="translate(605, 28)">
    <rect width="125" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="62" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#38bdf8" font-weight="600">
      ⚡ Sep 26, 2026
    </text>
  </g>

  <!-- Grid Rings & Radial Axes -->
  <g>
    <polygon points="380.0,223.0 403.4,236.5 403.4,263.5 380.0,277.0 356.6,263.5 356.6,236.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/><polygon points="380.0,196.0 426.8,223.0 426.8,277.0 380.0,304.0 333.2,277.0 333.2,223.0" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/><polygon points="380.0,169.0 450.1,209.5 450.1,290.5 380.0,331.0 309.9,290.5 309.9,209.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/><polygon points="380.0,142.0 473.5,196.0 473.5,304.0 380.0,358.0 286.5,304.0 286.5,196.0" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8"/><polygon points="380.0,115.0 496.9,182.5 496.9,317.5 380.0,385.0 263.1,317.5 263.1,182.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="none" opacity="0.8"/>
    <line x1="380" y1="250" x2="380.0" y2="115.0" stroke="#334155" stroke-width="1.3" opacity="0.6"/><line x1="380" y1="250" x2="496.9" y2="182.5" stroke="#334155" stroke-width="1.3" opacity="0.6"/><line x1="380" y1="250" x2="496.9" y2="317.5" stroke="#334155" stroke-width="1.3" opacity="0.6"/><line x1="380" y1="250" x2="380.0" y2="385.0" stroke="#334155" stroke-width="1.3" opacity="0.6"/><line x1="380" y1="250" x2="263.1" y2="317.5" stroke="#334155" stroke-width="1.3" opacity="0.6"/><line x1="380" y1="250" x2="263.1" y2="182.5" stroke="#334155" stroke-width="1.3" opacity="0.6"/>
  </g>

  <!-- Radar Area -->
  <polygon points="380.0,120.4 489.9,186.6 477.0,306.0 380.0,368.8 295.8,298.6 272.4,187.9" fill="url(#radarFill)" stroke="#00f5ff" stroke-width="2.4" filter="url(#radarGlow)"/>

  <!-- Node Dots -->
  <g>
    <circle cx="380.0" cy="120.4" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><circle cx="489.9" cy="186.6" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><circle cx="477.0" cy="306.0" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><circle cx="380.0" cy="368.8" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><circle cx="295.8" cy="298.6" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/><circle cx="272.4" cy="187.9" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Axis Category Labels -->
  <g>
    
        <g transform="translate(380.0, 75.0)">
          <text text-anchor="middle" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            ⚡ AI Infra & Kernels
          </text>
          <text text-anchor="middle" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            96% capability index
          </text>
        </g>
        
        <g transform="translate(534.4, 165.5)">
          <text text-anchor="start" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            🌐 Distributed & Cloud
          </text>
          <text text-anchor="start" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            94% capability index
          </text>
        </g>
        
        <g transform="translate(534.4, 334.5)">
          <text text-anchor="start" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            🛡️ Security & Sandboxing
          </text>
          <text text-anchor="start" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            83% capability index
          </text>
        </g>
        
        <g transform="translate(380.0, 435.0)">
          <text text-anchor="middle" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            📊 Benchmarks & Evaluation
          </text>
          <text text-anchor="middle" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            88% capability index
          </text>
        </g>
        
        <g transform="translate(225.6, 334.5)">
          <text text-anchor="end" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            🤖 Embodied AI & Robotics
          </text>
          <text text-anchor="end" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            72% capability index
          </text>
        </g>
        
        <g transform="translate(225.6, 165.5)">
          <text text-anchor="end" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12.5" fill="#f1f5f9">
            💻 Architecture & Embedded
          </text>
          <text text-anchor="end" dy="14" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            92% capability index
          </text>
        </g>
        
  </g>

  <!-- Bottom Mini Legend -->
  <g transform="translate(32, 486)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">
      ● Metrics automatically synchronized via GitHub Actions on recent push events &bull; Excludes under-review work
    </text>
  </g>
</svg>
