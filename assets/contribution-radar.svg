          </text>
          <text text-anchor="start" dy="13" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            83%
          </text>
        </g>
        
        <g transform="translate(340.0, 372.0)">
          <text text-anchor="middle" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#f1f5f9">
            📊 Benchmarks & Evaluation
          </text>
          <text text-anchor="middle" dy="13" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            88%
          </text>
        </g>
        
        <g transform="translate(201.5, 281.5)">
          <text text-anchor="end" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#f1f5f9">
            🤖 Embodied AI & Robotics
          </text>
          <text text-anchor="end" dy="13" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#38bdf8" font-weight="600">
            72%
          </text>
        </g>
        
        <g transform="translate(201.5, 128.5)">
