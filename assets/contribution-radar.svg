<svg width="680" height="400" viewBox="0 0 680 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="680" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>

    <!-- Radar Area Gradient -->
    <linearGradient id="radarFill" x1="215" y1="80" x2="465" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="676" height="396" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Simple Header -->
  <text x="340" y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
    CONTRIBUTION FOCUS
  </text>

  <!-- Grid Rings & Radial Axes -->
  <g>
    <polygon points="340.0,180.0 361.7,192.5 361.7,217.5 340.0,230.0 318.3,217.5 318.3,192.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85"/><polygon points="340.0,155.0 383.3,180.0 383.3,230.0 340.0,255.0 296.7,230.0 296.7,180.0" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85"/><polygon points="340.0,130.0 405.0,167.5 405.0,242.5 340.0,280.0 275.0,242.5 275.0,167.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85"/><polygon points="340.0,105.0 426.6,155.0 426.6,255.0 340.0,305.0 253.4,255.0 253.4,155.0" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.85"/><polygon points="340.0,80.0 448.3,142.5 448.3,267.5 340.0,330.0 231.7,267.5 231.7,142.5" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="none" opacity="0.85"/>
    <line x1="340" y1="205" x2="340.0" y2="80.0" stroke="#334155" stroke-width="1.2" opacity="0.6"/><line x1="340" y1="205" x2="448.3" y2="142.5" stroke="#334155" stroke-width="1.2" opacity="0.6"/><line x1="340" y1="205" x2="448.3" y2="267.5" stroke="#334155" stroke-width="1.2" opacity="0.6"/><line x1="340" y1="205" x2="340.0" y2="330.0" stroke="#334155" stroke-width="1.2" opacity="0.6"/><line x1="340" y1="205" x2="231.7" y2="267.5" stroke="#334155" stroke-width="1.2" opacity="0.6"/><line x1="340" y1="205" x2="231.7" y2="142.5" stroke="#334155" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Radar Area -->
  <polygon points="340.0,85.0 441.8,146.2 429.9,256.9 340.0,315.0 262.1,250.0 240.4,147.5" fill="url(#radarFill)" stroke="#00f5ff" stroke-width="2.2" filter="url(#radarGlow)"/>

  <!-- Node Dots -->
  <g>
    <circle cx="340.0" cy="85.0" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/><circle cx="441.8" cy="146.2" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/><circle cx="429.9" cy="256.9" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/><circle cx="340.0" cy="315.0" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/><circle cx="262.1" cy="250.0" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/><circle cx="240.4" cy="147.5" r="4" fill="#38bdf8" stroke="#0b1120" stroke-width="2"/>
  </g>

  <!-- Axis Category Labels -->
  <g>
    
        <g transform="translate(340.0, 46.0)">
